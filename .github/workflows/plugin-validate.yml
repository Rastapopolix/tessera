name: Plugin validators (pluginval, clap-validator)

# The plugin (platform/plugin) through the two common validators, as a DAW would load it: pluginval (Tracktion,
# strictness 10, with the editor) on the VST3, clap-validator (free-audio) on the CLAP, on Linux and Windows.
# clap-validator is built from its tag with platform/plugin/clap_validator.patch, two fixes to 0.4.1: it
# deadlocked on a preset container with more than one preset (Tessera's demos), and it refused a Windows preset
# folder (C:\...) as "not absolute", though the CLAP header asks for a path the OS file functions take. The clap-validator checks listed in
# platform/plugin/clap_validator_skip.txt are skipped (the validator hangs in them).
# clap-validator checks listed in platform/plugin/clap_validator_known.txt are known to fail: they run in a step of
# their own that reports without failing the run; any other failure fails it. Builds the plugin as plugin.yml does
# (that workflow stays as it is). Nothing is published.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'platform/plugin/**'
      - 'platform/core/**'
      - 'web/sim/sim.c'
      - 'firmware/src/**'
      - 'firmware/third_party/**'
      - 'tools/**'
      - '.github/workflows/plugin-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_TAG: '0.4.1'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libharfbuzz-dev libfribidi-dev libraqm-dev libx11-dev xvfb
          python -m pip install Pillow fonttools==4.68.0
      - name: Build the plugin
        run: |
          cmake -S platform/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/plugin -j4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo-cv
          key: clap-validator-${{ env.CLAP_VALIDATOR_TAG }}-${{ hashFiles('platform/plugin/clap_validator.patch') }}-${{ runner.os }}
      - name: Get the validators
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Linux.zip"
          unzip -oq pluginval.zip
          [ -x ~/.cargo-cv/bin/clap-validator ] || {
            git clone -q --depth 1 --branch "$CLAP_VALIDATOR_TAG" https://github.com/free-audio/clap-validator cv-src &&
              git -C cv-src apply "$GITHUB_WORKSPACE/platform/plugin/clap_validator.patch" &&
              cargo install --locked --path cv-src --root ~/.cargo-cv
          }
      - name: pluginval (VST3, strictness 10, with the editor)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" ./pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 --validate build/plugin/out/Tessera.vst3 2>&1 | tee pluginval.log
          grep -q '^SUCCESS' pluginval.log
      - name: clap-validator (CLAP)
        timeout-minutes: 10
        run: |
          x=$(sed '/^#/d; /^$/d' platform/plugin/clap_validator_known.txt platform/plugin/clap_validator_skip.txt | sed 's/.*/^&$/' | sed 's/^/-x /' | tr '\n' ' ')
          xvfb-run -a ~/.cargo-cv/bin/clap-validator validate --only-failed $x build/plugin/out/Tessera.clap 2>&1 | tee cv.log
      - name: clap-validator, the known failures (reported, not failing)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t=$(sed '/^#/d; /^$/d' platform/plugin/clap_validator_known.txt | sed 's/.*/^&$/' | sed 's/^/-t /' | tr '\n' ' ')
          [ -n "$t" ] || { echo 'no known failures'; exit 0; }
          xvfb-run -a ~/.cargo-cv/bin/clap-validator validate --only-failed $t build/plugin/out/Tessera.clap 2>&1 | tee cv_known.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Plugin validators (Linux)'
            echo '```'
            grep -E '^(SUCCESS|FAILED)|!!!' pluginval.log 2>/dev/null | head -20 || true
            grep -E 'tests run' cv.log cv_known.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4   # (the Windows job builds from these: its Pillow has no Raqm)
        with:
          name: validate-generated-headers
          path: build/gen/

  windows:
    needs: linux
    if: always() && needs.linux.result != 'cancelled'
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validate-generated-headers
          path: build/gen
      - name: Build the plugin (Visual Studio, ClangCL)
        run: |
          cmake -S platform/plugin -B build/plugin -G "Visual Studio 17 2022" -A x64 -T ClangCL -DTESS_GEN=OFF
          cmake --build build/plugin --config Release --parallel
      - uses: actions/cache@v4
        with:
          path: ~/.cargo-cv
          key: clap-validator-${{ env.CLAP_VALIDATOR_TAG }}-${{ hashFiles('platform/plugin/clap_validator.patch') }}-${{ runner.os }}
      - name: Get the validators
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          [ -x ~/.cargo-cv/bin/clap-validator.exe ] || {
            git clone -q --depth 1 --branch "$CLAP_VALIDATOR_TAG" https://github.com/free-audio/clap-validator cv-src &&
              git -C cv-src apply "$GITHUB_WORKSPACE/platform/plugin/clap_validator.patch" &&
              cargo install --locked --path cv-src --root ~/.cargo-cv
          }
      - name: Find the outputs (Visual Studio puts them in a folder per configuration)
        run: |
          find build/plugin/out -maxdepth 3 | sort
          vst3=$(find build/plugin/out -maxdepth 3 -name Tessera.vst3 | head -1)
          clap=$(find build/plugin/out -maxdepth 3 -name Tessera.clap | head -1)
          [ -n "$vst3" ] && [ -n "$clap" ] || { echo "no Tessera.vst3 / Tessera.clap under build/plugin/out"; exit 1; }
          echo "VST3=$(cygpath -w "$(pwd)/$vst3")" >> "$GITHUB_ENV"
          echo "CLAP=$clap" >> "$GITHUB_ENV"
      - name: pluginval (VST3, strictness 10, with the editor)
        run: |
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --validate "$VST3" 2>&1 | tee pluginval.log
          grep -q '^SUCCESS' pluginval.log
      - name: clap-validator (CLAP)
        timeout-minutes: 10
        run: |
          x=$(sed '/^#/d; /^$/d' platform/plugin/clap_validator_known.txt platform/plugin/clap_validator_skip.txt | sed 's/.*/^&$/' | sed 's/^/-x /' | tr '\n' ' ')
          ~/.cargo-cv/bin/clap-validator.exe validate --only-failed $x "$CLAP" 2>&1 | tee cv.log
      - name: clap-validator, the known failures (reported, not failing)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t=$(sed '/^#/d; /^$/d' platform/plugin/clap_validator_known.txt | sed 's/.*/^&$/' | sed 's/^/-t /' | tr '\n' ' ')
          [ -n "$t" ] || { echo 'no known failures'; exit 0; }
          ~/.cargo-cv/bin/clap-validator.exe validate --only-failed $t "$CLAP" 2>&1 | tee cv_known.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Plugin validators (Windows)'
            echo '```'
            grep -E '^(SUCCESS|FAILED)|!!!' pluginval.log 2>/dev/null | head -20 || true
            grep -E 'tests run' cv.log cv_known.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
