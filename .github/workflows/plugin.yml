name: Plugin (VST3 / CLAP / standalone)

# Tessera as a plugin (platform/plugin): the firmware as the web simulator runs it, wrapped as a CLAP instrument and,
# through clap-wrapper, as VST3 and a standalone app. Linux builds CLAP + VST3 and runs the render test (a minimal
# CLAP host: STILL TIDE sounds, a note sounds, the state is a .tsp record, the window shows the screen
# under Xvfb) and the panel test. Windows builds CLAP, VST3 and the
# standalone app with Visual Studio's clang (ClangCL), from the Linux job's generated headers, and keeps them as the
# run's artifact. Both run the copies test (several instances: the private copies of the core apart). Nothing is
# published.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'platform/plugin/**'
      - 'platform/core/**'
      - 'web/sim/sim.c'
      - 'firmware/src/**'
      - 'tests/hostsim.c'
      - 'tests/ui_test.c'
      - 'tools/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libharfbuzz-dev libfribidi-dev libraqm-dev libx11-dev xvfb
          python -m pip install Pillow fonttools==4.68.0
      - name: Configure
        run: cmake -S platform/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/plugin -j4
      - name: Panel test
        run: build/plugin/tessera-panel-test
      - name: Sync test (following the DAW)
        run: build/plugin/tessera-sync-test
      - name: Copies test (several instances)
        run: build/plugin/tessera-copies-test
      - name: Project files test (.tsp, FM-1 backups)
        run: build/plugin/tessera-projfile-test
      - name: Render test (with the window, on a virtual display)
        run: xvfb-run -s "-screen 0 1280x800x24" build/plugin/tessera-render-test build/plugin/out/Tessera.clap 12 build/plugin/still-tide-48k.wav build/plugin/window.ppm
      - name: Session test (three instances saved, closed and opened again)
        run: build/plugin/tessera-session-test build/plugin/out/Tessera.clap
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-linux
          path: |
            build/plugin/out/Tessera.clap
            build/plugin/out/Tessera.vst3
            build/plugin/still-tide-48k.wav
            build/plugin/window.ppm
      - uses: actions/upload-artifact@v4   # (the Windows job builds from these: its Pillow has no Raqm)
        with:
          name: generated-headers
          path: build/gen/

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-headers
          path: build/gen
      - name: Configure (Visual Studio, ClangCL)
        run: cmake -S platform/plugin -B build/plugin -G "Visual Studio 17 2022" -A x64 -T ClangCL -DTESS_GEN=OFF
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: Panel and sync tests
        run: |
          build/plugin/Release/tessera-panel-test.exe
          build/plugin/Release/tessera-sync-test.exe
          build/plugin/Release/tessera-copies-test.exe
          build/plugin/Release/tessera-projfile-test.exe
      - name: List the outputs
        shell: bash
        run: find build/plugin/out -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-windows
          path: build/plugin/out/
