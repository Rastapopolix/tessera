name: Plugin (VST3 / CLAP / standalone)

# Tessera as a plugin (platform/plugin): the firmware as the web simulator runs it, wrapped as a CLAP instrument and,
# through clap-wrapper, as VST3 and a standalone app. Linux builds CLAP + VST3 and runs the render test (a minimal
# CLAP host: STILL TIDE sounds, a note sounds, the state is a .tsp record). Windows builds CLAP, VST3 and the
# standalone app with Visual Studio's clang (ClangCL) and keeps them as the run's artifact. Nothing is published.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'platform/plugin/**'
      - 'web/sim/sim.c'
      - 'firmware/src/**'
      - 'tests/hostsim.c'
      - 'tests/ui_test.c'
      - 'tools/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install Pillow fonttools==4.68.0
      - name: Configure
        run: cmake -S platform/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/plugin -j4
      - name: Render test
        run: build/plugin/tessera-render-test build/plugin/out/Tessera.clap 12 build/plugin/still-tide-48k.wav
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-linux
          path: |
            build/plugin/out/Tessera.clap
            build/plugin/out/Tessera.vst3
            build/plugin/still-tide-48k.wav

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install Pillow fonttools==4.68.0
      - name: Configure (Visual Studio, ClangCL)
        run: cmake -S platform/plugin -B build/plugin -G "Visual Studio 17 2022" -A x64 -T ClangCL -DTESS_PLUGIN_TESTS=OFF
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: List the outputs
        shell: bash
        run: find build/plugin/out -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-windows
          path: build/plugin/out/
