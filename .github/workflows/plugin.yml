name: Plugin (VST3 / CLAP / standalone)

# Tessera as a plugin (platform/plugin): the firmware as the web simulator runs it, wrapped as a CLAP instrument and,
# through clap-wrapper, as VST3 and a standalone app. Linux builds CLAP + VST3 and runs the render test (a minimal
# CLAP host: STILL TIDE sounds, a note sounds, the state is a .tsp record, the window shows the screen
# under Xvfb) and the panel test. Windows builds CLAP, VST3 and the
# standalone app with Visual Studio's clang (ClangCL), from the Linux job's generated headers, and keeps them as the
# run's artifact. macOS builds CLAP, VST3, AU and the standalone app as universal binaries (arm64 + x86_64) from the
# same headers, runs the tests and the render test with the window (Cocoa: the screen drawn into the view's layer), and
# keeps them (unsigned) as the run's artifact. All run the copies test (several instances: the private copies of the
# core apart). Nothing is published.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'platform/plugin/**'
      - 'platform/core/**'
      - 'web/sim/sim.c'
      - 'firmware/src/**'
      - 'tests/hostsim.c'
      - 'tests/ui_test.c'
      - 'tools/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libharfbuzz-dev libfribidi-dev libraqm-dev libx11-dev xvfb
          python -m pip install Pillow fonttools==4.68.0
      - name: Configure
        run: cmake -S platform/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/plugin -j4
      - name: Panel test
        run: build/plugin/tessera-panel-test
      - name: Sync test (following the DAW)
        run: build/plugin/tessera-sync-test
      - name: Zones test (the mouse on the screen)
        run: build/plugin/tessera-zones-test
      - name: Copies test (several instances)
        run: build/plugin/tessera-copies-test
      - name: Project files test (.tsp, FM-1 backups)
        run: build/plugin/tessera-projfile-test
      - name: FM-1 on USB test (the decoder and the link, no hardware)
        run: build/plugin/tessera-fm1-test
      - name: Resample test (the core's 44.1 kHz to the host's rate)
        run: build/plugin/tessera-resample-test
      - name: "MIDI clip test (MIDI under the keys: the .mid written)"
        run: build/plugin/tessera-midifile-test
      - name: LISTEN test (the notes that set the key and GENERATE)
        run: build/plugin/tessera-listen-test
      - name: Render test (with the window, on a virtual display)
        run: xvfb-run -s "-screen 0 1280x800x24" build/plugin/tessera-render-test build/plugin/out/Cosmati.clap 12 build/plugin/still-tide-48k.wav build/plugin/window.ppm
      - name: Session test (three instances saved, closed and opened again)
        run: build/plugin/tessera-session-test build/plugin/out/Cosmati.clap
      - name: "Presets test (the DAW's preset browser: the demos, the user's folder, loading)"
        run: build/plugin/tessera-presets-test build/plugin/out/Cosmati.clap
      - name: "Presets test, VST3 (the wrapper's program list: listed and loaded)"
        timeout-minutes: 5
        run: build/plugin/tessera-vst3-presets-test build/plugin/out/Cosmati.vst3 demos/koto-garden.tsp
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-linux
          path: |
            build/plugin/out/Cosmati.clap
            build/plugin/out/Cosmati.vst3
            build/plugin/still-tide-48k.wav
            build/plugin/window.ppm
      - uses: actions/upload-artifact@v4   # (the Windows job builds from these: its Pillow has no Raqm)
        with:
          name: generated-headers
          path: build/gen/

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-headers
          path: build/gen
      - name: Configure (Visual Studio, ClangCL)
        run: cmake -S platform/plugin -B build/plugin -G "Visual Studio 17 2022" -A x64 -T ClangCL -DTESS_GEN=OFF
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: Panel and sync tests
        run: |
          build/plugin/Release/tessera-panel-test.exe
          build/plugin/Release/tessera-sync-test.exe
          build/plugin/Release/tessera-zones-test.exe
          build/plugin/Release/tessera-copies-test.exe
          build/plugin/Release/tessera-projfile-test.exe
          build/plugin/Release/tessera-fm1-test.exe
          build/plugin/Release/tessera-resample-test.exe
          build/plugin/Release/tessera-midifile-test.exe
          build/plugin/Release/tessera-listen-test.exe
      - name: List the outputs
        shell: bash
        run: find build/plugin/out -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-windows
          path: build/plugin/out/

  macos:
    needs: linux
    runs-on: macos-latest   # (macos-14 is no longer offered: "not supported")
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-headers
          path: build/gen
      - name: 'Configure (universal: arm64 + x86_64)'
        run: |
          cmake -S platform/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DTESS_GEN=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build/plugin -j4
      - name: Panel, sync, copies and project files tests
        run: |
          build/plugin/tessera-panel-test
          build/plugin/tessera-sync-test
          build/plugin/tessera-zones-test
          build/plugin/tessera-copies-test
          build/plugin/tessera-projfile-test
          build/plugin/tessera-fm1-test
          build/plugin/tessera-resample-test
          build/plugin/tessera-midifile-test
          build/plugin/tessera-listen-test
      - name: Render test (with the window)
        run: build/plugin/tessera-render-test build/plugin/out/Cosmati.clap 12 build/plugin/still-tide-48k.wav build/plugin/window.ppm
      - name: Session test (three instances saved, closed and opened again)
        run: build/plugin/tessera-session-test build/plugin/out/Cosmati.clap
      - name: "Presets test (the DAW's preset browser: the demos, the user's folder, loading)"
        run: build/plugin/tessera-presets-test build/plugin/out/Cosmati.clap
      - name: "Presets test, Audio Unit (the wrapper's factory presets: listed and loaded)"
        timeout-minutes: 5
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/out/Cosmati.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i tess || true
          build/plugin/tessera-au-presets-test
      - name: List the outputs (both architectures in each)
        run: |
          find build/plugin/out -maxdepth 4 | sort
          for b in Cosmati.clap Cosmati.vst3 Cosmati.component Cosmati.app; do
            f=$(find "build/plugin/out/$b" -path '*/Contents/MacOS/*' -type f | head -1)
            [ -n "$f" ] || { echo "missing: $b"; exit 1; }
            lipo -info "$f"
            lipo "$f" -verify_arch arm64 x86_64
          done
      - name: Pack the bundles in a tar
        run: tar -C build/plugin/out -czf build/plugin/tessera-plugin-macos.tar.gz Cosmati.clap Cosmati.vst3 Cosmati.component Cosmati.app
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-plugin-macos
          path: |
            build/plugin/tessera-plugin-macos.tar.gz
            build/plugin/window.ppm
