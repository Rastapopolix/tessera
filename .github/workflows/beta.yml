name: Beta on the installer

# A branch beta/X.Y[.Z]-suffix (e.g. beta/3.3-beta1, made from develop) builds that beta as a release is built (the full
# host suite, both variants with --release), puts it on the public installer's Beta choice with web/publish_beta.py
# (main's docs/: its release, editor and project page kept) and pushes that to branch site-beta-VERSION, made from
# main, for a pull request into main. Merging it makes the beta live; the release it leads to takes it off again
# (web/make_site.py), or web/publish_beta.py docs --off before then. (The cloud cannot build the device image, so
# this workflow does.)
on:
  push:
    branches: ['beta/*']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tessera-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/.nightly-deps/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/.nightly-deps/sdk
      PARALLEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Version
        run: |
          v="${GITHUB_REF_NAME#beta/}"
          echo "$v" | grep -Eq '^[0-9]\.[0-9]{1,2}(\.[0-9])?-[A-Za-z0-9]+$' ||
            { echo "branch $GITHUB_REF_NAME: use beta/X.Y[.Z]-suffix, e.g. beta/3.3-beta1"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install Pillow fonttools==4.68.0   # (the webfont check: Tessera Mono as generated)
      - uses: actions/cache@v4
        with:
          path: .nightly-deps
          key: jieli-linux-sdk-d179b448-v1
      - name: Fetch pinned SDK and toolchain
        run: |
          if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
            tools/get_toolchain.sh "$GITHUB_WORKSPACE/.nightly-deps/jieli"
          fi
          if [ ! -d "$AC79_SDK/.git" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
      - name: Full host suite (on a development build)
        run: |
          ./build.sh
          tests/run_tests.sh
      - name: Build both variants
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          MELODEE_LOOK=1 ./build.sh --release "$V" 2>&1 | tee dual.log
          cp "build/tessera-$V.fwsc" "$RUNNER_TEMP/pkgs"/
          MELODEE_DUAL_CORE=0 MELODEE_LOOK=1 ./build.sh --release "$V" 2>&1 | tee single.log
          cp "build/tessera-$V-1core.fwsc" "$RUNNER_TEMP/pkgs"/
          (cd "$RUNNER_TEMP/pkgs" && sha256sum *.fwsc | tee SHA256SUMS)
          {
            echo "### Tessera $V (beta)"
            echo '```'
            grep -h -E -i "image [0-9]+ B|audio working arena|\.data\+\.bss|^app |^package " dual.log single.log
            cat "$RUNNER_TEMP/pkgs"/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ env.V }}
          path: ${{ runner.temp }}/pkgs/*
      - name: The installer's Beta, pushed to site-beta-${{ env.V }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit=$(git rev-parse HEAD)
          git worktree add -B "site-beta-$V" ../page origin/main
          python web/publish_beta.py ../page/docs --dual "$RUNNER_TEMP/pkgs/tessera-$V.fwsc" --single "$RUNNER_TEMP/pkgs/tessera-$V-1core.fwsc" \
            --version "$V" --commit "$commit" --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes docs/BETA_NOTES.md
          cd ../page
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/webapp/installer docs/firmware docs/words   # (words: the screen reader's, make_site.py)
          git add -f docs/firmware/*.fwsc
          git commit -q -m "Installer: beta $V (${commit:0:7})" -m "Built by .github/workflows/beta.yml from $GITHUB_REF_NAME."
          git show --stat HEAD | tail -5
          git push -f origin "site-beta-$V"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "site-beta-$V" --title "Installer: Tessera $V beta" \
            --body "The public installer's **Beta** choice: Tessera $V (both cores) from $GITHUB_REF_NAME at ${commit:0:7}. Merging makes it live. Built by .github/workflows/beta.yml (run $GITHUB_RUN_ID)." ||
            echo "::notice::No pull request opened (the token may not be allowed to): open one from site-beta-$V into main"
